# WacOS (Liquid) settings. Everything here has a default, so you don't need this file at all:
# System Settings (the Apple menu) changes most of it for you and writes config.ini.
# To set things by hand, copy this file to config.ini, change it, then restart Liquid
# (Apple menu > Reload Liquid, or Ctrl+Alt+Shift+R). Lines starting with # are ignored.

# ---- Menu bar
# logo=✦                     menu bar logo (any text or emoji)
# menubar=glass              glass | clear
# menubar_height=24          px at 100% scaling (macOS is 24)
# dynamic_island=on          music, Claude Code status, notifications and Face ID in the middle of the bar

# ---- Dock
# icon_size=38               px at 100% scaling, 32 to 96
# magnify=1.6                1 = no magnification
# autohide=off               the Dock slides away until the pointer touches the bottom edge
# dock_overlap=on            windows slide under the Dock so the glass bends them
# icon_style=tahoe           tahoe (silver glyphs on dark tiles) | dark | clear | color
# finder=on                  File Explorer first
# trash=on                   Recycle Bin last
# Dock pins: exe or .lnk paths, one per line, in order. None = your Windows taskbar pins.
# pin=C:\Windows\System32\notepad.exe

# ---- Desktop
# widgets=on                 desktop widgets (right-click the desktop > Edit Widgets)
# desktop_icons=on           WacOS draws the desktop icons (Windows' own are hidden)
# desktop_menu=on            glass right-click menu on the desktop

# ---- Windows and spaces
# traffic_lights=on          close / minimise / zoom dots on the active window
# hide_caption_buttons=on    hide Windows' own buttons on classic apps
# frost_windows=on           acrylic backdrop and dark title bars where an app allows it
# round_corners=on
# window_animations=on       windows shrink into the Dock and grow out of it
# fullscreen_spaces=on       a maximised window gets its own space
# spaces_mode=screen         screen (each monitor has its own spaces) | desktop (Windows virtual desktops)
# app_switcher=on            macOS-style app switcher on Alt+Tab
# gestures=on                right-drag left/right switches spaces, up = Task View, down = desktop
# gestures_everywhere=on     right-drag over app windows too (off = desktop, menu bar and Dock only)
# borderless_apps=javaw.exe,Minecraft.Windows.exe   always borderless full screen (exe names)

# ---- Keyboard
# spotlight=on               Alt+Space opens Spotlight
# windows_key_spotlight=on   tapping the Windows key opens Spotlight instead of Start
# volume_hud=on              the volume keys show WacOS's volume bubble

# ---- Notifications
# mac_notifications=on       banners in the top right instead of Windows' toasts
# island_notifications=on    new notifications also drop into the Dynamic Island

# ---- Lock screen and Face ID
# lock_screen=on
# lock_on_start=on
# lock_on_wake=on
# lock_idle_minutes=5        0 = never (not while music plays or the camera sees you)
# away_lock_seconds=60       walk away: the camera sees nobody and there's no input -> lock (0 = off)
# away_pause_seconds=20      ... and pause the music (0 = off); Face ID starts it again
# lock_wallpaper=            a picture path, or "desktop". Empty = wallpapers\lock.png, else the desktop's
# air_ring=on                Air Ring (the webcam): Face ID, walk-away lock and air gestures
# The PIN is set the first time the lock screen shows; Liquid stores only a salted hash of it here.

# ---- Remote viewing
# recordable=off             on = WacOS shows in screenshots and recordings (the glass then bends the
#                            wallpaper instead of live windows). Streams from Moonlight, RustDesk,
#                            Axiom and Remote Desktop are detected and handled without this.
